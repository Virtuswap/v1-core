name: tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests
    steps:
    - uses: actions/checkout@v3
    - name: Install packages
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'
    - name: Environment
      uses: actions/setup-node@v3
    - name: Install dependencies
      run: npm ci
    - name: Compile
      run: npm run compile
    - name: Run tests
      run: npm test
